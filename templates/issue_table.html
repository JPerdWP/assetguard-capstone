<div class="table-wrap"><table><thead><tr><th>Issue</th><th>Severity</th><th>Status</th><th>Owner</th><th>Reported</th></tr></thead><tbody>{% for i in issues %}<tr><td><a href="{{url_for('issue_detail',id=i.id)}}">{{i.title}}</a><small>#{{i.id}}{% if i.tag is defined %} · {{i.tag}}{% endif %}</small></td><td><span class="badge {{i.severity|lower}}">{{i.severity}}</span></td><td><span class="status {{'resolved' if i.status=='Resolved'}}">{{i.status}}</span></td><td>{{i.owner}}</td><td>{{i.reported_at|date}}</td></tr>{% else %}<tr><td class="empty" colspan="5">No issues match this view.</td></tr>{% endfor %}</tbody></table></div>
